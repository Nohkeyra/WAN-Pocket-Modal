name: Deploy Modal GPU Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "modal_gpu_smoketest.py"
      - ".github/workflows/deploy-modal.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install "modal==1.6.4"

      - name: Show Modal version
        run: modal --version

      - name: Deploy GPU smoke test
        run: modal deploy modal_gpu_smoketest.py
        
